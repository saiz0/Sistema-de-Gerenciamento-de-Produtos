services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE must be set}
        NGINX_IMAGE: ${NGINX_IMAGE:?NGINX_IMAGE must be set}
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT must be set}:5173"
    environment:
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:?FRONTEND_API_BASE_URL must be set}
      VITE_USE_POLLING: ${FRONTEND_USE_POLLING:?FRONTEND_USE_POLLING must be set}
      VITE_POLL_INTERVAL: ${FRONTEND_POLL_INTERVAL:?FRONTEND_POLL_INTERVAL must be set}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
      args:
        NODE_IMAGE: ${NODE_IMAGE:?NODE_IMAGE must be set}
        NGINX_IMAGE: ${NGINX_IMAGE:?NGINX_IMAGE must be set}
    environment:
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:?FRONTEND_API_BASE_URL must be set}
      VITE_USE_POLLING: ${FRONTEND_USE_POLLING:?FRONTEND_USE_POLLING must be set}
      VITE_POLL_INTERVAL: ${FRONTEND_POLL_INTERVAL:?FRONTEND_POLL_INTERVAL must be set}
    command: ["pnpm", "test"]

  swagger:
    image: ${SWAGGER_UI_IMAGE:?SWAGGER_UI_IMAGE must be set}
    ports:
      - "${SWAGGER_PORT:?SWAGGER_PORT must be set}:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./backend/docs:/docs:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${APP_PORT:?APP_PORT must be set}:8000"
    environment:
      DB_CONNECTION: ${DB_CONNECTION:?DB_CONNECTION must be set}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:?DB_PORT must be set}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set}
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "${DB_FORWARD_PORT:?DB_FORWARD_PORT must be set}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      APP_ENV: testing
      DB_CONNECTION: ${TEST_DB_CONNECTION:?TEST_DB_CONNECTION must be set}
      DB_HOST: ${TEST_DB_HOST:?TEST_DB_HOST must be set}
      DB_PORT: ${TEST_DB_PORT:?TEST_DB_PORT must be set}
      DB_DATABASE: ${TEST_DB_DATABASE:?TEST_DB_DATABASE must be set}
      DB_USERNAME: ${TEST_DB_USERNAME:?TEST_DB_USERNAME must be set}
      DB_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    tmpfs:
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    command: ["php", "artisan", "test"]

  postgres-test:
    profiles: ["test"]
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set}
    environment:
      POSTGRES_DB: ${TEST_DB_DATABASE:?TEST_DB_DATABASE must be set}
      POSTGRES_USER: ${TEST_DB_USERNAME:?TEST_DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  backend-bootstrap-cache:
  backend-storage:
  backend-vendor:
  frontend-node-modules:
  postgres-data:
